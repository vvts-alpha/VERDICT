name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Windows runner
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build packages
        run: pnpm -r build
        shell: bash

      - name: Stage production workspace
        run: |
          node tools/package-desktop.cjs prepare "$RUNNER_TEMP/verdict-production" ./bundle
        shell: bash

      - name: Install locked production dependencies for Windows
        run: pnpm --dir "$RUNNER_TEMP/verdict-production" install --frozen-lockfile --prod --node-linker=hoisted --ignore-scripts
        shell: bash

      - name: Materialize self-contained desktop bundle
        run: node tools/package-desktop.cjs materialize "$RUNNER_TEMP/verdict-production" ./bundle
        shell: bash

      - name: Package Windows installer (electron-builder)
        working-directory: bundle
        run: npx --yes electron-builder@26.15.3 --config electron-builder.yml --win --x64 --publish never
        shell: bash

      - name: Verify packaged Windows executables
        run: node tools/check-desktop-bundle.cjs bundle/dist-installer/win-unpacked
        shell: bash

      - name: Upload VERDICT installer
        uses: actions/upload-artifact@v4
        with:
          name: verdict-windows-installer
          path: |
            bundle/dist-installer/*.exe
            bundle/dist-installer/artifact-manifest.json
            bundle/dist-installer/SHA256SUMS.txt
            bundle/dist-installer/smoke.png
          if-no-files-found: error

      - name: Upload win-unpacked
        uses: actions/upload-artifact@v4
        with:
          name: verdict-windows-unpacked
          path: bundle/dist-installer/win-unpacked/
          if-no-files-found: error
          include-hidden-files: true

      - name: Download installer for artifact roundtrip verification
        uses: actions/download-artifact@v4
        with:
          name: verdict-windows-installer
          path: artifact-check

      - name: Download application for artifact roundtrip verification
        uses: actions/download-artifact@v4
        with:
          name: verdict-windows-unpacked
          path: artifact-check/win-unpacked

      - name: Verify downloaded artifacts preserve the tested application
        run: node tools/check-desktop-bundle.cjs artifact-check/win-unpacked
        shell: bash
