name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-app

jobs:
  build:
    name: Build on Windows runner
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build packages
        run: pnpm -r build
        shell: bash

      - name: Materialize self-contained desktop bundle
        run: |
          pnpm --filter @veritas/desktop deploy ./bundle
          # deploy copies package "files"; keep the builder config at the bundle root even if packing omits it
          cp apps/desktop/electron-builder.yml bundle/electron-builder.yml
        shell: bash

      - name: Package Windows installer (electron-builder)
        working-directory: bundle
        run: npx --yes electron-builder --config electron-builder.yml --win --x64
        shell: bash

      - name: Upload VERDICT installer
        uses: actions/upload-artifact@v4
        with:
          name: verdict-windows-installer
          path: bundle/dist-installer/*.exe
          if-no-files-found: error

      - name: Upload win-unpacked
        uses: actions/upload-artifact@v4
        with:
          name: verdict-windows-unpacked
          path: bundle/dist-installer/win-unpacked/
          if-no-files-found: error
