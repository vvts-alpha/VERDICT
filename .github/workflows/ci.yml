name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node >= 24 is mandatory — the state store uses the builtin node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (workspace dep order)
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test (node:test via tsx)
        run: pnpm -r test
